<!doctype html>
<html lang="ko" class="auth-pending study-app">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <script src="/assets/js/study-shell.js?v=20260922-study-v2"></script>
  <meta name="description" content="평가원 6월·9월·수능 문제지를 골라 하나의 PDF로 내려받는 개인용 도구.">
  <meta name="robots" content="noindex, nofollow">
  <title>기출 — hvsdcm</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="/assets/css/system.css?v=20260922-study-v2">
  <link rel="stylesheet" href="/gichul/gichul.css?v=20260904-icons-v2">
  <link rel="stylesheet" href="/assets/css/study-toss.css?v=20260922-study-v2">
  <link rel="stylesheet" href="/gichul/toss.css?v=20260922-study-v2">
</head>
<body class="gichul-page study-toss">
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar-inner container-wide study-topbar">
      <a class="brand" href="/" aria-label="hvsdcm 홈"><img class="brand-mark" src="/assets/logo.svg" alt="">hvsdcm</a>
      <span class="topbar-crumb">학습실</span>
      <nav class="study-routes" aria-label="학습실 이동">
        <a class="study-route-link" href="/gichul/" aria-current="page"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260904-icons-v2#icon-file"></use></svg><span>기출</span></a>
        <a class="study-route-link" href="/WordMaster/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260904-icons-v2#icon-book-open"></use></svg><span>워드마스터</span></a>
        <a class="study-route-link" href="/smstudy/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260904-icons-v2#icon-layers"></use></svg><span>사회·문화</span></a>
      </nav>
      <button id="studyThemeToggle" class="study-theme-toggle" type="button" aria-label="다크 모드로 전환"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260904-icons-v2#icon-monitor"></use></svg><span>다크 모드</span></button>
    </div>
  </header>
  <div class="topbar-spacer"></div>

  <div class="container-wide app-page">
    <div class="app-shell">
      <!-- 필터는 전부 app.js가 매니페스트에서 도출해 그린다. 과목·년도·시행 목록을 여기
           마크업에 적으면 손으로 적은 사본이 되고(승격 규칙 "파생 가능한 것을 손으로
           적지 않는다"), 미로그인 문서에 시험 목록이 남는다. -->
      <aside id="gichulFilters" class="sidebar" aria-label="기출 필터"></aside>

      <main id="app" class="app-main" tabindex="-1">
        <div class="view-head">
          <div class="view-head-main">
            <svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260904-icons-v2#icon-file"></use></svg>
            <div>
              <h1>기출</h1>
              <p id="studyFilterSummary">평가원 6월 · 9월 · 수능 문제지</p>
            </div>
          </div>
          <button id="studyFilterTrigger" class="btn btn-secondary study-filter-trigger" type="button" aria-haspopup="dialog" aria-controls="studyFilterDialog" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260904-icons-v2#icon-settings"></use></svg>필터 설정</button>
        </div>
        <div id="gichulBody" class="gi-body"></div>
      </main>
    </div>
  </div>

  <footer class="app-footer">
    <div class="container-wide app-footer-inner">
      <span>문항 저작권은 한국교육과정평가원에 있으며 비상업적 개인 학습용으로만 씁니다.</span>
      <span class="text-tertiary">hvsdcm</span>
    </div>
  </footer>

  <dialog id="studyFilterDialog" class="study-filter-dialog" aria-labelledby="studyFilterTitle">
    <div class="study-sheet-head"><div><p class="kicker">시험지 찾기</p><h2 id="studyFilterTitle">원하는 기출만 골라요</h2></div><button class="btn btn-ghost" type="button" data-close-filters aria-label="기출 필터 닫기">닫기</button></div>
    <div id="studyFilterContent"></div>
    <div class="study-sheet-foot"><button class="btn btn-primary" type="button" data-close-filters>선택한 조건으로 보기</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/account.js?v=20260904-auth-gate-v1" data-app="gichul"></script>
  <!-- 공통 학습 유틸(이스케이프·토스트)은 컨트롤러보다 먼저 온다 (load order 계약,
       scripts/validate.mjs가 순서를 고정한다). -->
  <script src="/assets/js/study-utils.js?v=20260924-shared-utils-v1"></script>
  <!-- pdf-lib(526KB raw / 207KB gzip)은 병합 버튼을 누를 때만 필요하다. 여기서 미리
       받지 않고 gichul/app.js의 loadPdfLib()가 병합 시점에 한 번만 동적으로 받는다
       (scripts/validate.mjs가 이 지연 로딩 계약을 검사한다). -->
  <script src="/gichul/app.js?v=20260924-shared-utils-v1"></script>
</body>
</html>
